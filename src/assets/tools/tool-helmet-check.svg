<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="563" viewBox="0 0 1000 563">
  <!--
    工具卡片「安全帽觀念快篩」的背景圖（原創向量插圖，不是第三方素材，所以不需要授權標示）。
    這個 .svg 是原始檔，同目錄的 tool-helmet-check.jpg 由它輸出（1000x563，與其他工具卡片一致）。
    構圖：卡片會由上往下疊深色遮罩，只有上緣約三分之一看得清楚，
    所以雪鏡與帽殼刻意壓在畫面上半部；卡片在窄螢幕會裁掉左右，主體因此置中。
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#071f34"/>
      <stop offset="45%" stop-color="#11456c"/>
      <stop offset="100%" stop-color="#2e7ba8"/>
    </linearGradient>
    <linearGradient id="shell" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e6f1fb"/>
      <stop offset="74%" stop-color="#bad0e3"/>
      <stop offset="100%" stop-color="#8ba7c0"/>
    </linearGradient>
    <linearGradient id="lens" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#0b2d4a"/>
      <stop offset="45%" stop-color="#17608f"/>
      <stop offset="80%" stop-color="#3ea3cf"/>
      <stop offset="100%" stop-color="#0e3b5c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#7dd3fc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#dbeaf6" stop-opacity="0.32"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.72">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>

    <!-- 帽殼輪廓：內部的耳罩、內襯都切在這個形狀裡，才不會溢出邊緣 -->
    <path id="shellPath"
          d="M -300 10 C -300 -180, -206 -330, 0 -330 C 206 -330, 300 -180, 300 10
             L 300 62 C 300 132, 248 170, 168 174 L -168 174 C -248 170, -300 132, -300 62 Z"/>
    <clipPath id="shellClip"><use href="#shellPath"/></clipPath>
  </defs>

  <!-- 背景：夜藍天空、遠山與雪坡 -->
  <rect width="1000" height="563" fill="url(#sky)"/>
  <rect width="1000" height="563" fill="url(#glow)"/>
  <path d="M0 392 L128 286 L212 346 L320 254 L428 362 L470 338 L560 414 L668 310 L774 386 L880 296 L1000 388 L1000 563 L0 563 Z"
        fill="#0d3556" opacity="0.9"/>
  <path d="M320 254 L356 290 L338 300 L314 288 L286 306 L264 290 Z" fill="#e8f3fb" opacity="0.72"/>
  <path d="M880 296 L916 332 L892 340 L868 326 L846 338 L830 324 Z" fill="#e8f3fb" opacity="0.58"/>
  <path d="M0 452 C 180 408, 340 474, 520 450 C 700 426, 850 478, 1000 444 L1000 563 L0 563 Z"
        fill="#dfeefa" opacity="0.9"/>
  <rect y="356" width="1000" height="207" fill="url(#haze)"/>

  <!-- 安全帽特寫。整頂帽子畫在原點附近，再用 transform 擺到畫面上半部 -->
  <g transform="translate(500 168) scale(0.7)">
    <!-- 下巴帶（畫在帽殼後面，兩端收在耳罩下方） -->
    <path d="M -238 150 C -236 248, -150 302, 0 304 C 150 302, 236 248, 238 150"
          fill="none" stroke="#0c2438" stroke-width="19" stroke-linecap="round"/>
    <rect x="-44" y="286" width="88" height="34" rx="11" fill="#17405f" stroke="#0c2438" stroke-width="5"/>

    <!-- 帽殼 -->
    <use href="#shellPath" fill="url(#shell)"/>

    <g clip-path="url(#shellClip)">
      <!-- 右側暗面，做出球面的立體感 -->
      <path d="M 120 -330 C 250 -250, 300 -110, 300 20 L 300 180 L 60 180
               C 176 120, 214 -10, 200 -140 C 194 -218, 166 -290, 120 -330 Z"
            fill="#0a2a44" opacity="0.15"/>
      <!-- 左上高光 -->
      <path d="M -186 -80 C -180 -196, -128 -286, -46 -320 C -104 -234, -130 -142, -132 -46 Z"
            fill="#ffffff" opacity="0.5"/>
      <!-- 帽緣內襯 -->
      <rect x="-306" y="146" width="612" height="46" fill="#0c2438" opacity="0.45"/>
      <!-- 通風孔 -->
      <g fill="#0c2438" opacity="0.66">
        <rect x="-118" y="-268" width="82" height="18" rx="9"/>
        <rect x="-41" y="-280" width="82" height="18" rx="9"/>
        <rect x="36" y="-268" width="82" height="18" rx="9"/>
        <rect x="-96" y="-206" width="60" height="16" rx="8"/>
        <rect x="36" y="-206" width="60" height="16" rx="8"/>
      </g>
    </g>
    <use href="#shellPath" fill="none" stroke="#0c2438" stroke-width="5" opacity="0.28"/>

    <!-- 耳罩：掛在帽殼兩側、略低於帽緣 -->
    <path d="M -294 36 C -240 30, -206 58, -204 106 L -204 168 C -204 214, -232 238, -268 236
             C -296 234, -310 212, -310 172 L -310 82 C -310 56, -304 38, -294 36 Z" fill="#12395a"/>
    <path d="M 294 36 C 240 30, 206 58, 204 106 L 204 168 C 204 214, 232 238, 268 236
             C 296 234, 310 212, 310 172 L 310 82 C 310 56, 304 38, 294 36 Z" fill="#12395a"/>

    <!-- 雪鏡的鏡帶：從帽殼兩側繞過去 -->
    <rect x="-330" y="-118" width="80" height="96" rx="20" fill="#0c2438"/>
    <rect x="250" y="-118" width="80" height="96" rx="20" fill="#0c2438"/>

    <!-- 雪鏡 -->
    <rect x="-304" y="-146" width="608" height="160" rx="76" fill="#0e2b42"/>
    <rect x="-278" y="-126" width="556" height="120" rx="60" fill="url(#lens)"/>
    <path d="M -246 -22 C -196 -104, -76 -130, 24 -120 C -66 -100, -156 -66, -208 -10 Z" fill="url(#sheen)"/>
    <rect x="-304" y="-146" width="608" height="160" rx="76" fill="none" stroke="#dbeaf6" stroke-width="3" opacity="0.26"/>
  </g>

  <!-- 飄雪 -->
  <g fill="#ffffff">
    <circle cx="74" cy="92" r="5" opacity="0.66"/>
    <circle cx="136" cy="206" r="3.5" opacity="0.48"/>
    <circle cx="56" cy="322" r="4" opacity="0.42"/>
    <circle cx="912" cy="84" r="4.5" opacity="0.6"/>
    <circle cx="952" cy="212" r="3" opacity="0.44"/>
    <circle cx="876" cy="296" r="5" opacity="0.38"/>
    <circle cx="286" cy="56" r="3" opacity="0.38"/>
    <circle cx="704" cy="46" r="3.5" opacity="0.42"/>
  </g>
</svg>
